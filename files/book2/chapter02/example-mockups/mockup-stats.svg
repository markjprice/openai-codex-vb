<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" width="360" height="720" font-family="Atkinson Hyperlegible, Verdana, Arial, sans-serif">
  <title>Puzzle Pocket mockup: the stats screen</title>
  <!-- Phone outline -->
  <rect x="8" y="8" width="344" height="704" rx="44" fill="#1F2328"/>
  <rect x="20" y="20" width="320" height="680" rx="34" fill="#FAF8F5"/>
  <rect x="140" y="30" width="80" height="8" rx="4" fill="#1F2328"/>

  <!-- Status bar and heading -->
  <text x="44" y="64" font-size="14" font-weight="700" fill="#1F2328">9:41</text>
  <text x="44" y="112" font-size="28" font-weight="700" fill="#1F2328">Your stats</text>
  <text x="44" y="140" font-size="16" fill="#5B626B">Saved on this phone</text>

  <!-- Sliding numbers -->
  <rect x="40" y="166" width="280" height="110" rx="16" fill="#FFFFFF" stroke="#D5E3E3" stroke-width="2"/>
  <text x="60" y="198" font-size="16" font-weight="700" fill="#0F6E6E">Sliding numbers</text>
  <text x="60" y="244" font-size="36" font-weight="700" fill="#1F2328">1:42</text>
  <text x="60" y="264" font-size="14" fill="#5B626B">Best time</text>
  <text x="300" y="244" font-size="20" font-weight="700" text-anchor="end" fill="#1F2328">12</text>
  <text x="300" y="264" font-size="14" text-anchor="end" fill="#5B626B">Games</text>

  <!-- Word wheel -->
  <rect x="40" y="292" width="280" height="110" rx="16" fill="#FFFFFF" stroke="#D5E3E3" stroke-width="2"/>
  <text x="60" y="324" font-size="16" font-weight="700" fill="#0F6E6E">Word wheel</text>
  <text x="60" y="370" font-size="36" font-weight="700" fill="#1F2328">24</text>
  <text x="60" y="390" font-size="14" fill="#5B626B">Best score (words)</text>
  <text x="300" y="370" font-size="20" font-weight="700" text-anchor="end" fill="#1F2328">7</text>
  <text x="300" y="390" font-size="14" text-anchor="end" fill="#5B626B">Games</text>

  <!-- Noughts and crosses -->
  <rect x="40" y="418" width="280" height="110" rx="16" fill="#FFFFFF" stroke="#D5E3E3" stroke-width="2"/>
  <text x="60" y="450" font-size="16" font-weight="700" fill="#0F6E6E">Noughts and crosses</text>
  <text x="60" y="496" font-size="36" font-weight="700" fill="#1F2328">3</text>
  <text x="60" y="516" font-size="14" fill="#5B626B">Win streak</text>
  <text x="300" y="496" font-size="20" font-weight="700" text-anchor="end" fill="#1F2328">9 / 4</text>
  <text x="300" y="516" font-size="14" text-anchor="end" fill="#5B626B">Wins / draws</text>

  <!-- Bottom bar -->
  <line x1="20" y1="620" x2="340" y2="620" stroke="#E6E2DC" stroke-width="2"/>
  <g font-size="13" text-anchor="middle">
    <rect x="152" y="634" width="56" height="6" rx="3" fill="#0F6E6E"/>
    <text x="90" y="664" fill="#5B626B">Puzzles</text>
    <text x="180" y="664" font-weight="700" fill="#0F6E6E">Stats</text>
    <text x="270" y="664" fill="#5B626B">Settings</text>
  </g>
</svg>
