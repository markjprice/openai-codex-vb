<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" width="360" height="720" font-family="Atkinson Hyperlegible, Verdana, Arial, sans-serif">
  <title>Puzzle Pocket mockup: the puzzle hub</title>
  <!-- Phone outline -->
  <rect x="8" y="8" width="344" height="704" rx="44" fill="#1F2328"/>
  <rect x="20" y="20" width="320" height="680" rx="34" fill="#FAF8F5"/>
  <rect x="140" y="30" width="80" height="8" rx="4" fill="#1F2328"/>

  <!-- Status bar -->
  <text x="44" y="64" font-size="14" font-weight="700" fill="#1F2328">9:41</text>

  <!-- Heading -->
  <text x="44" y="112" font-size="28" font-weight="700" fill="#1F2328">Puzzle Pocket</text>
  <text x="44" y="140" font-size="16" fill="#5B626B">Choose a puzzle</text>

  <!-- Card 1: Noughts and crosses -->
  <rect x="40" y="166" width="280" height="96" rx="16" fill="#FFFFFF" stroke="#D5E3E3" stroke-width="2"/>
  <rect x="56" y="184" width="60" height="60" rx="12" fill="#E6F2F2"/>
  <g stroke="#0F6E6E" stroke-width="3" stroke-linecap="round">
    <line x1="80" y1="194" x2="80" y2="234"/>
    <line x1="92" y1="194" x2="92" y2="234"/>
    <line x1="66" y1="208" x2="106" y2="208"/>
    <line x1="66" y1="220" x2="106" y2="220"/>
  </g>
  <text x="128" y="208" font-size="17" font-weight="700" fill="#1F2328">Noughts and crosses</text>
  <text x="128" y="232" font-size="14" fill="#5B626B">Play with a friend</text>

  <!-- Card 2: Sliding numbers -->
  <rect x="40" y="278" width="280" height="96" rx="16" fill="#FFFFFF" stroke="#D5E3E3" stroke-width="2"/>
  <rect x="56" y="296" width="60" height="60" rx="12" fill="#E6F2F2"/>
  <g font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">
    <rect x="63" y="303" width="22" height="22" rx="4" fill="#0F6E6E"/><text x="74" y="319">1</text>
    <rect x="87" y="303" width="22" height="22" rx="4" fill="#0F6E6E"/><text x="98" y="319">2</text>
    <rect x="63" y="327" width="22" height="22" rx="4" fill="#0F6E6E"/><text x="74" y="343">3</text>
  </g>
  <text x="128" y="320" font-size="17" font-weight="700" fill="#1F2328">Sliding numbers</text>
  <text x="128" y="344" font-size="14" fill="#5B626B">Best time 1:42</text>

  <!-- Card 3: Word wheel -->
  <rect x="40" y="390" width="280" height="96" rx="16" fill="#FFFFFF" stroke="#D5E3E3" stroke-width="2"/>
  <rect x="56" y="408" width="60" height="60" rx="12" fill="#E6F2F2"/>
  <circle cx="86" cy="438" r="20" fill="none" stroke="#0F6E6E" stroke-width="3"/>
  <circle cx="86" cy="438" r="7" fill="#E8833A"/>
  <text x="128" y="432" font-size="17" font-weight="700" fill="#1F2328">Word wheel</text>
  <text x="128" y="456" font-size="14" fill="#5B626B">Best score 24 words</text>

  <!-- Win streak -->
  <rect x="40" y="510" width="280" height="56" rx="28" fill="#FDEBDD"/>
  <text x="180" y="544" font-size="16" font-weight="700" text-anchor="middle" fill="#1F2328">Win streak: 3</text>

  <!-- Bottom bar -->
  <line x1="20" y1="620" x2="340" y2="620" stroke="#E6E2DC" stroke-width="2"/>
  <g font-size="13" text-anchor="middle">
    <rect x="62" y="634" width="56" height="6" rx="3" fill="#0F6E6E"/>
    <text x="90" y="664" font-weight="700" fill="#0F6E6E">Puzzles</text>
    <text x="180" y="664" fill="#5B626B">Stats</text>
    <text x="270" y="664" fill="#5B626B">Settings</text>
  </g>
</svg>
